<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body bgcolor="orange">
    <table>
        <tr>
            <td > <img src="./Images/Sinhgad.jpg" alt="Sinhgad College" width="200px" height="200px"></td>
            <td><h1> Sinhgad College of Science, Pune </h1></td>
        </tr>
    </table>

    
    <form>
        <fieldset width="50%">
        
            <legend>Student Information</legend>
            <br>
            <label >Enter Full Name:</label>
            <input type="text" id="firstname" name="firstname" placeholder="first name" required>
            <input type="text" id="middlename" name="middlename" placeholder="middle name" required>
            <input type="text" id="lastname" name="lastname" placeholder="last name" required>
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <br><br>
            <label >Contact Number:</label>
            <input type="tel" id="tel" name="tel" placeholder="Enter your contact number" required>
            <br><br>
            <label for="gender">Gender:</label> 
            <input type="radio" id="male" name="gender" value="male" required>
            <lebel for="male">Male</label> 
            <input type="radio" id="female" name="gender" value="female" required>
            <lebel for="female">Female</label>
            <br><br>
            <label for="address">Address:</label>
            <br>
            <input type="text" size="100" placeholder="Street Address" required>
            <br><br>
            <input type="text" size="47" placeholder="City" required>
            <input type="text" size="47" placeholder="State" required>
            <br><br>
            <input type="text" size="47" placeholder="Country" required>
            <input type="text" size="47" placeholder="Zip Code" required>
            <br><br>
            <table>
                <tr>
                    <td><label for="course">Select Course:</label></td>
                    <td>
                         <input type="radio" name="course" value="BCA">
                         <label for="bsc">BCA(Bachelor of Computer Applications)</label><br>
                         <input type="radio" name="course" value="B.Com">
                         <label for="msc">B.Com(Bachelor of Commerce)</label><br>   
                         <input type="radio" name="course" value="B.Sc">
                         <label for="msc">B.Sc(Bachelor of Science)</label><br>
                         <input type="radio" name="course" value="BBA">
                         <label for="msc">BBA(Bachelor of Business Administration)</label><br>
                         <input type="radio" name="course" value="BMS">
                         <label for="msc">BMS(Bachelor of Management Studies)</label>
                    </td>
                </tr>
            </table>
            <br><br>

            <input type="submit"value="Submit" >
            <input type="reset" value="Reset">
            
        </fieldset>
    </form>
    
           
</body>
</html>
