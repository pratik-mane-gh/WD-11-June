<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List tag</title>
</head>
<body>
</body>
<!--Ordered list / Numbered list-->
    <ol type="a" start="3">   
     <li>HTML</li>
     <li>CSS</li>           
     <li>JavaScript</li>
     <li>Bootstrap</li>
    </ol>

<!--Unordered list / Bulleted list-->
    <ul type="square">  
     <li>HTML</li>
     <li>CSS</li>           
     <li>JavaScript</li>
     <li>Bootstrap</li>
    </ul>

<!--Description list / Definition list-->
    <dl>  
     <dt>HTML</dt>
     <dd>Hypertext Markup Language</dd>
     <dt>CSS</dt>
     <dd>Cascading Style Sheets</dd>
     <dt>JS</dt>
     <dd>JavaScript</dd>
    </dl>
</body>
</html>
