<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <form action="#">
        <fieldset width="50%">
        <legend>Registration Form</legend>

        <br><br>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <br><br>
        <label for="address">Address:</label>
        <textarea id="address" name="address" placeholder="Enter your address" cols="40" rows="5"></textarea>

        <br><br>

        <label for="mobile">Contact No:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your contact number">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" >
        <label for="male">Male</label>
        <input type="radio" name="gender">
        <label for="female">Female</label>
        
        <br><br>
        <!--Checkboxes-->
        <label for="hobbies">Course:</label>
        <input type="checkbox" >Web-Development
        <input type="checkbox" >SQL 
        <input type="checkbox">C
        <input type="checkbox" >JAVA
        <input type="checkbox" >Testing 
        <input type="checkbox">Python

        <br><br>
        <!-- Dropdown -->
        <label for="course">Select Branch:</label>
        <select>
            <option value="">Select a branch</option>
            <option value="hadapsar">Hadapsar</option>
            <option value="Shivaji nagar">Shivaji Nagar</option>
            <option value="pcmc">PCMC</option>
        </select>

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

        <button type="button">Go to Chess Board</button>
        </fieldset>
    </form>
</body>

</html>
