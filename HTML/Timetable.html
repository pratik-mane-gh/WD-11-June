<!--Create a timetable using rowspan and colspan.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable</title>
</head>
<body>
    <table border="2" bgcolor="lightgray" cellspacing="5" cellpadding="10">
        <caption>Timetable</caption>
        <tr>
            <th colspan="2">Subject</th>
            <th colspan="2">Time</th>
        </tr>
        <tr>
            <td colspan="2">Mathematics</td>
            <td colspan="2">9:00 AM - 10:30 AM</td>
        </tr>
        <tr>
            <td colspan="2">Physics</td>
            <td colspan="2">11:00 AM - 12:30 PM</td>    
        </tr>
        <tr>
            <td colspan="2">Chemistry</td>
            <td colspan="2">1:00 PM - 2:30 PM</td>        
        </tr>
        <tr>
            <td colspan="2">Biology</td>
            <td colspan="2">3:00 PM - 4:30 PM</td>
        </tr>   
        <tr>
            <td colspan="2">Computer Science</td>
            <td colspan="2">5:00 PM - 6:30 PM</td>
        </tr>  
    </table>
    
</body>
</html>
