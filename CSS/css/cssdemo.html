<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Types</title>
    <link rel="stylesheet" href="demo.css">
    <style>
        h2{
            color: rgb(224, 123, 96);
        }
        h1{
            color:green;
        }
    </style>
</head>
<body>
    
    <!-- Inline CSS -->
    <h1 >Welcome to CSS Types</h1>
    
    <!-- Internal CSS -->  
    <h2>Here we are using internal CSS</h2>

    <!-- External CSS -->
     <p >Here we are using external CSS.</p>
</body>
</html>
