<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Carousel Slider</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
    }

    .carousel {
      width: 80%;
      height: 400px;
      margin: 50px auto;
      overflow: hidden;
      border-radius: 15px;
      position: relative;
    }

    .slides {
      width: 300%;
      height: 100%;
      display: flex;
      transition: 0.6s;
      background-size: cover;
    }

    .slide {
      width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    input {
      display: none;
    }

    /* Slide movement */
    #slide1:checked ~ .slides {
      margin-left: 0;
    }

    #slide2:checked ~ .slides {
      margin-left: -100%;
    }

    #slide3:checked ~ .slides {
      margin-left: -200%;
    }

    /* Navigation dots */
    .navigation {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .bar {
      width: 15px;
      height: 15px;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
    }

    .bar:hover {
      background-color: white;
    }
  </style>
</head>
<body>

  <div class="carousel">

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">

    <div class="slides">
      <div class="slide">
        <img src="./dhurandhar.jpg" alt="Slide 1">
      </div>

      <div class="slide">
        <img src="./Lingam.jpg" alt="Slide 2">
      </div>

      <div class="slide">
        <img src="./Tavvaihorizontal.jpg" alt="Slide 3">
      </div>
    </div>

    <div class="navigation">
      <label for="slide1" class="bar"></label>
      <label for="slide2" class="bar"></label>
      <label for="slide3" class="bar"></label>
    </div>

  </div>

</body>
</html>
