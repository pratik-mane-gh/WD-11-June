<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Corousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</head>

<body>
    <!--carousel-->
    
     <!--carousel-->
    <section id="demo" class="carousel slide carousel-fade" data-bs-ride="carousel" style="background-color: black;">
      <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="./images/arjun-vyjayanthi.avif" alt="" class="d-block w-100" height="900px">
        </div>
        <div class="carousel-item">
             <img src="./images/dangal.avif" alt="" class="d-block w-100" height="900px">
        </div>
        <div class="carousel-item">
             <img src="./images/Lingam.avif" alt="" class="d-block w-100" height="900px" >
        </div>
        <div class="carousel-item">
             <img src="./images/LunchBox.avif" alt="" class="d-block w-100" height="900px" >
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true" ></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true" ></span>
    </button>
    </section>
</body>

</html>
