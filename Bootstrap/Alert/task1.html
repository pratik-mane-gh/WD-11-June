<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap alert Task</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
         <!--
             Task: Course Admission Alert Page
                   Create one webpage using Bootstrap alerts.
             Requirements :
             1. Add Bootstrap CSS and JS CDN.
             2. Add one heading:
                Course Admission Status
             3. Create these 5 alerts:
                Success Alert :
                Your admission form submitted successfully.
                Danger Alert :
                Payment failed. Please try again.
                Warning Alert :
                Your documents are pending.
                Info Alert :
                New batch starts from Monday.
                Closable Warning Alert :
                Please complete your profile before admission.
             4. The last alert must have a close button.
             5. Put all alerts inside a Bootstrap container.
             6. Add spacing from top using mt-5. 
        -->

       <main>
       
        <section >

             <div class="container mt-5">

                <h1 class="text-center mb-4">Course Admission Status</h1>

                <div class="alert alert-success">
                    Your admission form submitted successfully.
                </div>
                <div class="alert alert-danger">
                    Payment failed. Please try again.
                </div>
                <div class="alert alert-warning">
                    Your documents are pending.
                </div>
                <div class="alert alert-info">
                    New batch starts from Monday.
                </div>
                <div class="alert alert-warning alert-dismissible fade show">
                    Please complete your profile before admission.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            </div>
        </section>
       </main>
    
</body>
</html>
