<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</head>
<body>

    <form action="" class=" m-5">
        <div class="mb-3">
            <label for="UserName" class="form-label col-2">UserName</label>
            <input type="text" class="col-3"  placeholder="Enter your Username"> 
        </div>
        <div class="mb-3">
            <label for="Password" class="form-label col-2">Password</label>
           <input type="password" class="col-3"  placeholder="Enter your password">
        </div>
        <button type="button" class="btn btn-outline-success" >Submit</button>

    </form>
    
</body>
</html>
