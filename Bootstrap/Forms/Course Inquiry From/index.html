<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Inquiry Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Course Inquiry Form</h1>

        <form>
            <div class="mb-3">
                <label class="form-label">Full Name </label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label class="form-label">Contact No</label>
                <input type="tel" class="form-control" placeholder="Enter your Contact no">
            </div>
            <div class="mb-3">
                <label class="form-label">Select Course</label>
                <select class="form-select form-control">
                    <option selected>Select Your Course</option>
                    <option>Full Stack Developer</option>
                    <option>Front-end Developer</option>
                    <option>AWS</option>
                    <option>Software Testing</option>
                    <option>Data Analyst</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" placeholder="Enter your message"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="agree">
                <label class="form-check-label" for="agree">I agree to receive course updates</label>
            </div>
            <div>
                <button type="submit" class="btn btn-success">Submit</button>
            </div>

        </form>

    </div>
    
</body>
</html>
